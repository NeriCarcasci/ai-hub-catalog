name: Validate Unified Model Catalog Data Image Fixture

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/**'
      - 'input/**'
      - 'release/**'
      - 'cmd/release-candidate/**'
      - 'internal/releasecandidate/**'
      - 'Dockerfile'
      - 'Dockerfile.konflux'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/build-and-push-static-model-catalog-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Test and stage the qualification-contract fixture
        run: |
          make test
          make validate-release-candidate-fixture

      # This proves report/digest validation, exact loader-matrix membership,
      # and unified layout without publishing fixture data. Product promotion
      # must supply the protected handoff and approved compatibility matrix.
      # The public, digest-pinned UBI override lets fork CI build without
      # registry.redhat.io credentials; product builds retain Dockerfile's
      # separately pinned default base.
      - name: Build unified data image fixture
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BASE_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal@sha256:a21d19f72557aa893a0f6ca1177bb1ffd91df6015e60470a116c50a6a05efcd9
            RELEASE_CANDIDATE_DIR=build/release-candidate-fixture
          load: true
          push: false
          tags: unified-model-catalog-data:fixture
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify payload as an arbitrary non-root user
        run: |
          docker run --rm --user 1001230000 --entrypoint /bin/sh unified-model-catalog-data:fixture -c '
            test -r /app/data/validated-models-catalog.yaml &&
            test -r /app/data/redhat-serving-runtimes-catalog.yaml &&
            test ! -e /app/data/validated-models-index.yaml &&
            test -r /app/benchmarks/manifest.json &&
            test -r /app/benchmarks/RedHatAI/Apertus-8B-Instruct-2509-FP8-dynamic/metadata.json
          '
